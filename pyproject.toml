[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-scanner"
dynamic = ["version"]
description = "Discover, assess, and secure AI agents across your infrastructure"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Scott Thornton" },
]
keywords = [
    "ai-security", "llm-security", "prompt-injection", "owasp",
    "vulnerability-scanner", "ai-agent", "mitre-atlas", "defensive-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "aiohttp>=3.14.5",
    "certifi>=2026.10.19",
    "click>=8.0.0",
    "dnspython>=2.4.0",
    "jsonschema>=4.23.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-sqlalchemy>=3.1.0",
    "sqlalchemy>=2.0.0",
    "cryptography>=41.0.0",
    "PyJWT>=2.8.0",
    "itsdangerous>=2.2.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "build>=1.2.2",
    "ruff>=0.11.0",
    "pip-audit>=2.9.0",
    "twine>=6.1.0",
    "bandit>=1.8.0",
]
server = ["gunicorn>=23.0.0"]
cloud = [
    "boto3>=1.34.0",
    "azure-identity>=1.15.0",
    "azure-mgmt-cognitiveservices>=14.1.0",
    "azure-ai-ml>=1.35.2",
    "google-cloud-aiplatform>=2.4.0",
]

[project.scripts]
ai-agent-scanner = "scanner_cli:cli"

[project.urls]
Homepage = "https://github.com/perfecxion-ai/ai-agent-scanner"
Repository = "https://github.com/perfecxion-ai/ai-agent-scanner"
Issues = "https://github.com/perfecxion-ai/ai-agent-scanner/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools]
py-modules = ["scanner_cli"]

[tool.setuptools.dynamic]
version = {attr = "src._version.__version__"}

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

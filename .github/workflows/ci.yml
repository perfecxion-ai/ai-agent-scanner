name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -v --cov=src --cov=app --cov=scanner_cli --cov-report=xml
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke test installed CLI outside repository
        run: sh scripts/package-smoke.sh dist/*.whl
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: distributions
          path: dist/*

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: ruff check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev,server,cloud]"
      - name: Check source security issues
        run: bandit -r src scanner_cli.py cli.py -ll
      - name: Audit installed dependencies
        run: pip-audit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t ai-agent-scanner:ci .
      - name: Smoke test HTTP server
        run: |
          docker run -d --name scanner -p 127.0.0.1:5000:5000 -e SECRET_KEY="$(openssl rand -hex 32)" ai-agent-scanner:ci
          trap 'docker logs scanner; docker rm -f scanner' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:5000/

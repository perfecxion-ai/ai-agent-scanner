name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -v --cov=src --cov=app --cov=scanner_cli --cov-report=xml
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Smoke test installed CLI outside repository
        run: sh scripts/package-smoke.sh dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.12'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.python-version == '3.12'
        with:
          name: distributions
          path: downloaded-distributions
          digest-mismatch: error
      - name: Verify uploaded distribution contents
        if: matrix.python-version == '3.12'
        run: diff -r dist downloaded-distributions

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: ruff check .

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev,server,cloud]"
      - name: Check source security issues
        run: bandit -r src app.py scanner_cli.py cli.py -ll
      - name: Audit installed dependencies
        run: pip-audit

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build container
        run: docker build -t ai-agent-scanner:ci .
      - name: Smoke test HTTP server
        run: |
          docker run -d --name scanner -p 127.0.0.1:5000:5000 -e SECRET_KEY="$(openssl rand -hex 32)" ai-agent-scanner:ci
          trap 'docker logs scanner; docker rm -f scanner' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:5000/
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:5000/health/ready
          docker restart scanner
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:5000/health/ready
